name: tuti-dev

services:
  app:
    image: tuti:dev
    container_name: tuti-dev
    build:
      context: .
      target: dev
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    env_file:
      - .env
      - .env.development
    environment:
      CI: "true"
      WATCHPACK_POLLING: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/tuti-firebase-service-account.json
      APNS_PRIVATE_KEY_PATH: /run/secrets/tuti-apns-auth-key.p8
    command:
      - sh
      - -lc
      - >-
        CI=true pnpm install --frozen-lockfile --store-dir /pnpm/store &&
        (chown -R node:"$$(id -gn node)" /app/node_modules /pnpm/store
        /app/pnpm-lock.yaml /app/.next /app/src/generated 2>/dev/null || true) &&
        su node -c 'pnpm dev --hostname 0.0.0.0'
    ports:
      - "5080:3000"
    volumes:
      - .:/app
      - ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:-/var/services/homes/Tutiadmin/.tuti-secrets/firebase/tuti-push-sender.json}:/run/secrets/tuti-firebase-service-account.json:ro
      - ${APNS_PRIVATE_KEY_HOST_PATH:-/var/services/homes/Tutiadmin/.tuti-secrets/apple/tuti-apns-auth-key.p8}:/run/secrets/tuti-apns-auth-key.p8:ro
      - tuti_dev_node_modules:/app/node_modules
      - tuti_dev_pnpm_store:/pnpm/store
    group_add:
      - "${TUTI_SECRET_GID:-101}"
    depends_on:
      - db
    networks:
      - default
      - storage
    stdin_open: true
    tty: true

  db:
    image: postgis/postgis:17-3.5
    container_name: tuti-dev-db
    restart: unless-stopped
    ports:
      - "55432:5432"
    env_file:
      - .env.development
    volumes:
      - tuti_dev_postgres:/var/lib/postgresql/data

volumes:
  tuti_dev_node_modules:
  tuti_dev_pnpm_store:
  tuti_dev_postgres:

networks:
  storage:
    external: true
    name: tuti-storage
