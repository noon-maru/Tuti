name: tuti-prod

services:
  app:
    image: ${TUTI_APP_IMAGE:-tuti:prod}
    container_name: tuti-prod
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Run with --env-file .env.production}
        NEXT_PUBLIC_ACCOUNT_AUTH_ENABLED: ${NEXT_PUBLIC_ACCOUNT_AUTH_ENABLED:-true}
        NEXT_PUBLIC_SOCIAL_OAUTH_ENABLED: ${NEXT_PUBLIC_SOCIAL_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_APPLE_OAUTH_ENABLED: ${NEXT_PUBLIC_APPLE_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_KAKAO_OAUTH_ENABLED: ${NEXT_PUBLIC_KAKAO_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_JOURNAL_PUBLICATION_ENABLED: ${NEXT_PUBLIC_JOURNAL_PUBLICATION_ENABLED:-false}
        NEXT_PUBLIC_JOURNAL_PUBLICATION_AUDIENCE: ${NEXT_PUBLIC_JOURNAL_PUBLICATION_AUDIENCE:-internal}
    env_file:
      - .env
      - .env.production
    environment:
      TUTI_RELEASE: ${TUTI_RELEASE:-unknown}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/tuti-firebase-service-account.json
      APNS_PRIVATE_KEY_PATH: /run/secrets/tuti-apns-auth-key.p8
    restart: unless-stopped
    ports:
      - "5050:3000"
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:-/var/services/homes/Tutiadmin/.tuti-secrets/firebase/tuti-push-sender.json}:/run/secrets/tuti-firebase-service-account.json:ro
      - ${APNS_PRIVATE_KEY_HOST_PATH:-/var/services/homes/Tutiadmin/.tuti-secrets/apple/tuti-apns-auth-key.p8}:/run/secrets/tuti-apns-auth-key.p8:ro
    group_add:
      - "${TUTI_SECRET_GID:-101}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health?scope=liveness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - storage

  ops:
    image: ${TUTI_OPS_IMAGE:-tuti:ops}
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Run with --env-file .env.production}
        NEXT_PUBLIC_ACCOUNT_AUTH_ENABLED: ${NEXT_PUBLIC_ACCOUNT_AUTH_ENABLED:-true}
        NEXT_PUBLIC_SOCIAL_OAUTH_ENABLED: ${NEXT_PUBLIC_SOCIAL_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_APPLE_OAUTH_ENABLED: ${NEXT_PUBLIC_APPLE_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_KAKAO_OAUTH_ENABLED: ${NEXT_PUBLIC_KAKAO_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_JOURNAL_PUBLICATION_ENABLED: ${NEXT_PUBLIC_JOURNAL_PUBLICATION_ENABLED:-false}
        NEXT_PUBLIC_JOURNAL_PUBLICATION_AUDIENCE: ${NEXT_PUBLIC_JOURNAL_PUBLICATION_AUDIENCE:-internal}
    env_file:
      - .env
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - storage
    profiles:
      - ops

  db:
    image: postgis/postgis:17-3.5
    container_name: tuti-prod-db
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - tuti_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  tuti_prod_postgres:

networks:
  storage:
    external: true
    name: tuti-storage
