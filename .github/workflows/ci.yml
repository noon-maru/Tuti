name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  legal-postgres:
    # 운영 NAS·self-hosted runner·운영 접속정보를 사용하지 않는 일회성 검증.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      POSTGRES_BIN_DIR: /usr/lib/postgresql/17/bin
      LEGAL_POSTGRES_REQUIRED: 'true'
      LEGAL_POSTGRES_EXPECTED_MAJOR: '17'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/check-node-runtime.mjs
      - name: PostgreSQL 17 시험용 실행 파일 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - run: pnpm install --frozen-lockfile
      - name: 분리 DB 시험용 Prisma 클라이언트 생성
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      - name: 약관·권리 보호 SQL 제약과 백업 복원 검증
        run: pnpm test:legal:postgres
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://tuti_user:tuti_password@localhost:5432/tuti?schema=public
      NEXT_PUBLIC_API_BASE_URL: https://tuti.today/api
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/check-node-runtime.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm docs:check
      - run: pnpm test
      - name: 운영 민감정보 보호 설정으로 하루마디 검사
        run: node --import tsx --test --test-concurrency=1 test/harumadi-content.test.ts test/harumadi-library.test.ts test/harumadis.test.ts
        env:
          SENSITIVE_MADI_WORKFLOW_ENABLED: 'true'
      - run: pnpm lint
      - run: pnpm build:web
