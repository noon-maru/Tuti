[Unit]
Wants=network-online.target
After=network-online.target syno-volume-posthook.service pkg-ContainerManager-dockerd.service
RequiresMountsFor=/volume1/homes/Tutiadmin/actions-runner/tuti-production/actions-runner

[Service]
Restart=always
RestartSec=15s
# DSM systemd 219에서는 이 설정이 [Service]에 속한다.
StartLimitInterval=0
Environment=DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
